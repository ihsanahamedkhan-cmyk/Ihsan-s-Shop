<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin dashboard — Ihsan's Shop</title><link rel="stylesheet" href="/styles.css"></head>
<body class="admin-body dashboard-body">
  <header class="admin-header"><a class="wordmark" href="/"><span class="wordmark-mark">IS</span><span>Ihsan's Shop</span></a><div class="admin-header-actions"><span id="signedInAs"></span><a href="/" class="text-link">View shop ↗</a><button id="logoutButton" class="button button-ghost">Sign out</button></div></header>
  <main class="dashboard section-shell"><div class="dashboard-intro"><div><p class="eyebrow">Admin workspace</p><h1>Make it yours.</h1><p>Update your shop, keep the collection fresh, and control what customers see.</p></div><div class="dashboard-status"><span class="status-dot"></span> Store is live</div></div>
    <div class="dashboard-tabs"><button class="tab-button active" data-tab="products">Products <span id="productCount">0</span></button><button class="tab-button" data-tab="storefront">Storefront</button><button class="tab-button" data-tab="account">Account</button></div>
    <section class="dashboard-panel active" id="productsPanel"><div class="panel-heading"><div><p class="eyebrow">Your catalog</p><h2>Products</h2></div><button class="button button-dark" id="newProductButton">Add product <span>＋</span></button></div><div class="admin-table" id="adminProducts"></div></section>
    <section class="dashboard-panel" id="storefrontPanel"><div class="panel-heading"><div><p class="eyebrow">Brand & checkout</p><h2>Storefront settings</h2></div></div><form class="settings-form" id="settingsForm"><div class="form-section-label">Homepage</div><label>Shop name<input name="brandName" required></label><label>Small eyebrow text<input name="eyebrow"></label><label>Hero headline<input name="heroTitle" required></label><label>Hero description<textarea name="heroText" rows="3"></textarea></label><label>Hero button label<input name="heroButtonLabel"></label><label>Accent color<input name="accentColor" type="color"></label><div class="form-section-label">About & contact</div><label>About headline<input name="aboutTitle"></label><label>About text<textarea name="aboutText" rows="3"></textarea></label><label>Announcement bar<input name="announcement"></label><label>Order phone number<input name="phone"></label><label>Business hours<input name="hours"></label><label>Footer note<input name="footerNote"></label><div class="form-actions"><button class="button button-dark" type="submit">Save storefront <span>↗</span></button><p class="form-message" id="settingsMessage"></p></div></form></section>
    <section class="dashboard-panel" id="accountPanel"><div class="panel-heading"><div><p class="eyebrow">Security</p><h2>Change password</h2></div></div><form class="settings-form narrow-form" id="passwordForm"><label>Current password<input name="currentPassword" type="password" required></label><label>New password<input name="newPassword" type="password" minlength="8" required></label><label>Confirm new password<input name="confirmPassword" type="password" minlength="8" required></label><div class="form-actions"><button class="button button-dark" type="submit">Update password <span>↗</span></button><p class="form-message" id="passwordMessage"></p></div></form></section>
  </main>
  <div class="modal-backdrop" id="productModal"><section class="product-modal"><div class="drawer-header"><div><p class="eyebrow">Catalog editor</p><h2 id="modalTitle">Add product</h2></div><button class="close-button" id="closeModal">×</button></div><form class="settings-form" id="productForm"><input type="hidden" name="id"><label>Product name<input name="name" required maxlength="100"></label><label>Description<textarea name="description" rows="3" required></textarea></label><div class="two-column"><label>Price (USD)<input name="price" type="number" step="0.01" min="0" required></label><label>Inventory<input name="inventory" type="number" step="1" min="0" required></label></div><div class="two-column"><label>Category<input name="category" value="General"></label><label>Image label<input name="placeholder" value="Image coming soon"></label></div><div class="check-row"><label><input name="featured" type="checkbox"> Feature on homepage</label><label><input name="active" type="checkbox" checked> Visible in shop</label></div><div class="form-actions"><button class="button button-dark" type="submit">Save product <span>↗</span></button><p class="form-message" id="productMessage"></p></div></form></section></div><script src="/admin.js"></script>
</body>
</html>
